name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (device dir name, e.g. mediatek_filogic)'
        required: true
        default: mediatek_filogic

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  KWRT_REL: 25.12
  IB_NAME: kwrt-imagebuilder-mediatek-filogic.Linux-x86_64
  IB_URL: https://dl.openwrt.ai/releases/25.12/targets/mediatek/filogic/kwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
  IB_SHA256: 65bb2db7073ef9af6dac282f4934bdfe14d3182f26a6b6a12bd5d3a46aeaac82
  PROFILE: cudy_tr3000-mod
  UPLOAD_FIRMWARE_FOR_ARTIFACT: 'true'
  UPLOAD_FIRMWARE_FOR_RELEASE: 'true'
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get current date
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "DATE_DISPLAY=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Download ImageBuilder
        run: |
          curl -fL --retry 3 -o ib.tar.zst "$IB_URL"
          echo "$IB_SHA256  ib.tar.zst" | sha256sum -c -

      - name: Extract ImageBuilder
        run: tar --use-compress-program=unzstd -xf ib.tar.zst

      - name: Fix repositories
        run: sed -i 's#file://www/wwwroot/dl.openwrt.ai#https://dl.openwrt.ai#' "$IB_NAME/repositories.conf"

      - name: Build overlay (rebrand + custom files)
        run: |
          set -euo pipefail
          rm -rf /tmp/ov /tmp/brand
          mkdir -p /tmp/ov /tmp/brand
          # 1) 品牌：用 ImageBuilder 自带 base-files 包里的原版文件改名，版本号跟随上游不写死
          cd /tmp/brand
          tar -xf "$GITHUB_WORKSPACE/$IB_NAME"/packages/base-files_*.ipk
          tar -xzf data.tar.gz ./etc/openwrt_release ./etc/banner
          sed -i 's/Kwrt/TohsakaWrt/g' etc/openwrt_release etc/banner
          cp -a etc/. /tmp/ov/etc/
          # 2) 仓库自定义文件覆盖（优先级更高：脚本、配置、crontab、banner）
          files_dir="$GITHUB_WORKSPACE/devices/${{ inputs.target }}/files"
          test -d "$files_dir"
          cp -a "$files_dir/." /tmp/ov/
          chmod +x /tmp/ov/usr/bin/* /tmp/ov/etc/init.d/* /tmp/ov/etc/hotplug.d/tty/* /tmp/ov/etc/uci-defaults/* 2>/dev/null || true
          echo "=== overlay 内容 ==="
          find /tmp/ov -type f | sort

      - name: Add local packages
        run: |
          set -euo pipefail
          local_packages_dir="$GITHUB_WORKSPACE/devices/${{ inputs.target }}/local-packages"
          if [ -d "$local_packages_dir" ]; then
            shopt -s nullglob
            ipks=("$local_packages_dir"/*.ipk)
            if ((${#ipks[@]})); then
              cp -f "${ipks[@]}" "$IB_NAME/packages/"
            fi
          fi

      - name: Build image
        run: |
          cd "$IB_NAME"
          PKGS=$(grep -vE '^\s*(#|$)' "$GITHUB_WORKSPACE/devices/${{ inputs.target }}/packages.txt" | tr '\n' ' ')
          make image PROFILE="$PROFILE" PACKAGES="$PKGS" FILES="/tmp/ov"

      - name: Verify manifest
        run: |
          set -euo pipefail
          manifest_dir="$IB_NAME/bin/targets/mediatek/filogic"
          manifest=$(find "$manifest_dir" -maxdepth 1 -type f -name '*.manifest' -print -quit)
          test -n "$manifest"
          missing=0
          while IFS= read -r package; do
            [[ -z "$package" || "$package" =~ ^[[:space:]]*# ]] && continue
            if ! awk -v package="$package" '$1 == package { found = 1 } END { exit !found }' "$manifest"; then
              case "$package" in
                libblobmsg-json20240329|libjson-script20240329|libruby3.3|libubox20240329|libubus20250102)
                  echo "Known unavailable package: $package"
                  ;;
                *)
                  echo "Missing package from manifest: $package"
                  missing=1
                  ;;
              esac
            fi
          done < "$GITHUB_WORKSPACE/devices/${{ inputs.target }}/packages.txt"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Manifest verification passed."

      - name: Verify custom files in image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          sysupgrade=$(find "$IB_NAME/bin/targets/mediatek/filogic" -maxdepth 1 -name '*sysupgrade.bin' -print -quit)
          test -n "$sysupgrade"
          rm -rf /tmp/chk && mkdir -p /tmp/chk && cd /tmp/chk
          tar -xf "$GITHUB_WORKSPACE/$sysupgrade"
          root="$(find . -maxdepth 2 -name root -type f -print -quit)"
          test -n "$root"
          unsquashfs -q -no-exit-code -d rfs "$root" >/dev/null
          missing=0
          for f in \
            usr/bin/tohsakawrt-tgbot usr/bin/tohsakawrt-service-watch usr/bin/tohsakawrt-temp-watch \
            usr/bin/tohsakawrt-modem-heal usr/bin/tohsakawrt-uplink usr/bin/tohsaka-direct \
            usr/lib/tohsakawrt/common.sh etc/init.d/tohsakawrt-tgbot \
            etc/uci-defaults/99-tohsakawrt-setup etc/hotplug.d/tty/40-modem-heal \
            etc/config/tohsakawrt-tgbot etc/crontabs/root ; do
            if [ -x "rfs/$f" ] || [ -f "rfs/$f" ]; then echo "  ok  $f"; else echo "  MISSING  $f"; missing=1; fi
          done
          grep -q "TohsakaWrt" rfs/etc/openwrt_release && echo "  ok  brand=TohsakaWrt" || { echo "  MISSING brand"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "自定义文件未进镜像"; exit 1; }
          echo "自定义文件校验通过。"

      - name: Collect firmware
        run: |
          set -euo pipefail
          source_dir="$IB_NAME/bin/targets/mediatek/filogic"
          mkdir -p out
          cp "$source_dir"/*.bin "$source_dir"/*.manifest "$source_dir"/sha256sums out/
          sysupgrade=$(find "$source_dir" -maxdepth 1 -type f -name '*sysupgrade.bin' -print -quit)
          test -n "$sysupgrade"
          output_name="TohsakaWrt-${BUILD_DATE}-${PROFILE}-squashfs-sysupgrade.bin"
          mv "out/$(basename "$sysupgrade")" "out/$output_name"
          (cd out && sha256sum "$output_name" >> sha256sums)

      - name: Upload artifact
        uses: actions/upload-artifact@main
        if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true'
        with:
          name: TohsakaWrt-${{ env.BUILD_DATE }}-${{ inputs.target }}
          path: out/

      - name: Create release
        if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
        run: |
          cat > release.txt <<'NOTES'
          TohsakaWrt firmware built with Kwrt ImageBuilder ${{ env.KWRT_REL }}.
          NOTES

      - name: Upload firmware for release
        uses: softprops/action-gh-release@master
        if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: out/*
          name: TohsakaWrt ${{ env.DATE_DISPLAY }} ${{ env.PROFILE }}
          tag_name: TohsakaWrt-${{ env.BUILD_DATE }}-${{ env.PROFILE }}
          body_path: release.txt

      - name: Notify on failure
        if: failure() && env.TELEGRAM_TOKEN != ''
        continue-on-error: true
        run: |
          curl -k --data chat_id="$TELEGRAM_CHAT_ID" \
            --data "text=❌ TohsakaWrt ${KWRT_REL} ${PROFILE} 构建失败 | 运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" >/dev/null 2>&1

      - name: Telegram notification
        if: env.TELEGRAM_TOKEN
        continue-on-error: true
        run: |
          curl -k --data chat_id="$TELEGRAM_CHAT_ID" \
            --data "text=🎉 TohsakaWrt ${{ env.KWRT_REL }} ${{ env.PROFILE }} 构建成功" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        continue-on-error: true
        if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 15
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
