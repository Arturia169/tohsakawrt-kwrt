name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (device dir name, e.g. mediatek_filogic)'
        required: true
        default: mediatek_filogic

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  KWRT_REL: 25.12
  IB_NAME: kwrt-imagebuilder-mediatek-filogic.Linux-x86_64
  IB_URL: https://dl.openwrt.ai/releases/25.12/targets/mediatek/filogic/kwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
  IB_SHA256: 65bb2db7073ef9af6dac282f4934bdfe14d3182f26a6b6a12bd5d3a46aeaac82
  PROFILE: cudy_tr3000-mod
  UPLOAD_FIRMWARE_FOR_ARTIFACT: 'true'
  UPLOAD_FIRMWARE_FOR_RELEASE: 'true'
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get current date
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "DATE_DISPLAY=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Download ImageBuilder
        run: |
          curl -fL --retry 3 -o ib.tar.zst "$IB_URL"
          echo "$IB_SHA256  ib.tar.zst" | sha256sum -c -

      - name: Extract ImageBuilder
        run: tar --use-compress-program=unzstd -xf ib.tar.zst

      - name: Fix repositories
        run: sed -i 's#file://www/wwwroot/dl.openwrt.ai#https://dl.openwrt.ai#' "$IB_NAME/repositories.conf"

      - name: Rebrand to TohsakaWrt
        run: |
          mkdir -p /tmp/brand && cd /tmp/brand
          tar -xf "$GITHUB_WORKSPACE/$IB_NAME"/packages/base-files_*.ipk
          tar -xzf data.tar.gz ./etc/openwrt_release ./etc/banner
          sed -i 's/Kwrt/TohsakaWrt/g' etc/openwrt_release etc/banner

      - name: Build image
        run: |
          cd "$IB_NAME"
          PKGS=$(grep -vE '^\s*(#|$)' "$GITHUB_WORKSPACE/devices/${{ inputs.target }}/packages.txt" | tr '\n' ' ')
          make image PROFILE="$PROFILE" PACKAGES="$PKGS" FILES="/tmp/brand"

      - name: Verify manifest
        run: |
          set -euo pipefail
          manifest_dir="$IB_NAME/bin/targets/mediatek/filogic"
          manifest=$(find "$manifest_dir" -maxdepth 1 -type f -name '*.manifest' -print -quit)
          test -n "$manifest"
          missing=0
          while IFS= read -r package; do
            [[ -z "$package" || "$package" =~ ^[[:space:]]*# ]] && continue
            if ! awk -v package="$package" '$1 == package { found = 1 } END { exit !found }' "$manifest"; then
              case "$package" in
                libblobmsg-json20240329|libjson-script20240329|libruby3.3|libubox20240329|libubus20250102)
                  echo "Known unavailable package: $package"
                  ;;
                *)
                  echo "Missing package from manifest: $package"
                  missing=1
                  ;;
              esac
            fi
          done < "$GITHUB_WORKSPACE/devices/${{ inputs.target }}/packages.txt"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Manifest verification passed."

      - name: Collect firmware
        run: |
          set -euo pipefail
          source_dir="$IB_NAME/bin/targets/mediatek/filogic"
          mkdir -p out
          cp "$source_dir"/*.bin "$source_dir"/*.manifest "$source_dir"/sha256sums out/
          sysupgrade=$(find "$source_dir" -maxdepth 1 -type f -name '*sysupgrade.bin' -print -quit)
          test -n "$sysupgrade"
          output_name="TohsakaWrt-${BUILD_DATE}-${PROFILE}-squashfs-sysupgrade.bin"
          mv "out/$(basename "$sysupgrade")" "out/$output_name"
          (cd out && sha256sum "$output_name" >> sha256sums)

      - name: Upload artifact
        uses: actions/upload-artifact@main
        if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true'
        with:
          name: TohsakaWrt-${{ env.BUILD_DATE }}-${{ inputs.target }}
          path: out/

      - name: Create release
        if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
        run: |
          cat > release.txt <<'NOTES'
          TohsakaWrt firmware built with Kwrt ImageBuilder ${{ env.KWRT_REL }}.
          NOTES

      - name: Upload firmware for release
        uses: softprops/action-gh-release@master
        if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: out/*
          name: TohsakaWrt ${{ env.DATE_DISPLAY }} ${{ env.PROFILE }}
          tag_name: TohsakaWrt-${{ env.BUILD_DATE }}-${{ env.PROFILE }}
          body_path: release.txt

      - name: Telegram notification
        if: env.TELEGRAM_TOKEN
        continue-on-error: true
        run: |
          curl -k --data chat_id="$TELEGRAM_CHAT_ID" \
            --data "text=🎉 TohsakaWrt ${{ env.KWRT_REL }} ${{ env.PROFILE }} 构建成功" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        continue-on-error: true
        if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 15
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
